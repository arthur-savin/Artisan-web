<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="../images/brand/logo-artisan-web.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="apple-touch-icon" href="../images/brand/logo-artisan-web.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Site web artisan — Artisan-Web" />
    <meta
      property="og:image"
      content="https://artisan-web.fr/images/brand/logo-artisan-web.png"
    />
    <meta property="og:image:width" content="500" />
    <meta property="og:image:height" content="500" />
    <meta name="twitter:card" content="summary" />
    <title>Site web artisan — Artisan-Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/brand-base.css" />
    <link rel="stylesheet" href="../css/brand-tokens.css" />
    <link rel="stylesheet" href="../css/site-chrome.css" />
    <link rel="stylesheet" href="../css/flow.css" />
    <link rel="stylesheet" href="stub-common.css" />
    <style>
      .aw-hub-section {
        scroll-margin-top: calc(var(--aw-site-header-h) + 0.75rem);
        padding: 2.25rem 1rem;
        max-width: 40rem;
        margin: 0 auto;
      }
      .aw-hub-section h2 {
        font-family: var(--aw-font-display);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--aw-color-heading);
        margin: 0 0 1rem;
        font-size: clamp(1.2rem, 2.8vw, 1.5rem);
      }
      .aw-hub-section p {
        font-family: var(--aw-font-body);
        color: var(--aw-color-text-muted);
        line-height: 1.6;
        margin: 0 0 0.75rem;
      }
    </style>
  </head>
  <body>
    <div id="aw-site-header"></div>
    <div id="app">
      <div class="stub-wrap">
        <div class="brand-logo-wrap">
          <img
            class="brand-logo brand-logo--page-stub"
            src="../images/brand/logo-artisan-web.png"
            width="500"
            height="500"
            alt="Artisan-Web"
            decoding="async"
          />
        </div>
        <h1 class="question-title">Site web artisan</h1>
        <p class="tagline" id="params"></p>
        <p class="tagline">
          Hub pour la promesse, les offres et les liens par métier — contenu à
          enrichir.
        </p>
        <p><a href="../index.html">Lancer le parcours guidé</a></p>
      </div>
    </div>

    <section class="aw-hub-section" id="hub-liens" aria-labelledby="aw-hub-links-title">
      <h2 id="aw-hub-links-title">Aller plus loin</h2>
      <p>
        Découvrez les
        <a href="realisations.html">réalisations, offres et présentation</a>
        sur la page dédiée.
      </p>
    </section>

    <div id="aw-site-footer"></div>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var o = q.get("objectif");
        var el = document.getElementById("params");
        if (o && el) el.textContent = "Objectif transmis : " + o + ".";
      })();
    </script>
    <script src="../js/site-chrome.js" defer></script>
  </body>
</html>
