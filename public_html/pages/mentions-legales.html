<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="../images/brand/logo-artisan-web.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="apple-touch-icon" href="../images/brand/logo-artisan-web.png" />
    <title>Mentions légales — Artisan-Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/brand-base.css" />
    <link rel="stylesheet" href="../css/brand-tokens.css" />
    <link rel="stylesheet" href="../css/site-chrome.css" />
    <link rel="stylesheet" href="stub-common.css" />
    <style>
      .aw-legal-page {
        max-width: 40rem;
        margin: 0 auto;
        padding: calc(var(--aw-site-header-h) + 2rem) 1.25rem 3rem;
      }
      .aw-legal-page h1 {
        font-family: var(--aw-font-display);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--aw-color-heading);
        font-size: clamp(1.35rem, 3vw, 1.75rem);
        margin: 0 0 1.25rem;
      }
      .aw-legal-page p {
        font-family: var(--aw-font-body);
        color: var(--aw-color-text-muted);
        line-height: 1.6;
        margin: 0 0 1rem;
      }
    </style>
  </head>
  <body>
    <div id="aw-site-header"></div>
    <main class="aw-legal-page">
      <h1>Mentions légales</h1>
      <p>
        Page en cours de rédaction. Les informations relatives à l’éditeur, à
        l’hébergeur et aux cookies seront intégrées ici.
      </p>
    </main>
    <div id="aw-site-footer"></div>
    <script src="../js/site-chrome.js" defer></script>
  </body>
</html>
